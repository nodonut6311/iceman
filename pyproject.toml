[project]
name = "iceman"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rohan", email = "roamd6311@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "firecrawl-py>=4.50.0",
    "langchain-core>=1.6.9",
    "langchain-google-genai>=4.4.1",
    "langgraph>=1.2.14",
